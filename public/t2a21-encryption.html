<h1 align="center">t2a21-encryption</h1>
<textarea id="myArea01" rows="4" cols="70">Hello how are you</textarea><br />

<input
    type="button"
    value="encrypt"
    onclick="
        {
            function caesar(str) {
                let string = '';
                for (var i = 0; i < str.length; i++) {
                    var temp = str.charAt(i);
                    if (temp !== ' ' && temp !== '!' && temp !== '?') {
                        let code = temp.charCodeAt(0);
                        string += String.fromCharCode(
                            ((code - 97 + 13 + 26) % 26) + 97,
                        );
                    } else {
                        string += temp;
                    }
                }
                return string;
            }

            let input = document.getElementById('myArea01').value.toLowerCase();

            document.getElementById('myArea02').value = caesar(input);
        }
    "
/><br /><br />
