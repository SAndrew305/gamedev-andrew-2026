<script>
    async function fetchData(url) {
        const response = await fetch(url);
        const data = await response.json();
        console.log(data);

        const myJson = JSON.stringify(data, null, 2);
        document.getElementById("myDiv1").innerHTML = `<pre>${myJson}</pre>`;

        // Pick the image URL from whichever field the API uses
        const img = data.image || data.message || data.url;
        document.getElementById("myDiv1").innerHTML +=
            `<img src="${img}" alt="Random Image" style="max-width: 100%; height: auto;">`;

        // Bonus: show the fact if the API has one
        if (data.fact) {
            document.getElementById("myDiv1").innerHTML +=
                `<p>${data.fact}</p>`;
        }
    }
</script>
