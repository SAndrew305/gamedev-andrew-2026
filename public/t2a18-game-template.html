<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>t2a18 - game template</title>
        <link rel="stylesheet" href="../baseline.css" />
        <script src="../theme.js" defer></script>
        <script>
            // global variables here
            let myGlobalX = 0;
            let myClock;

            // global functions here

            // fix prettier. this is garbage formatting.
            function myHitOther(my1, my2) {
                left1 = parseInt(document.getElementById(my1).style.left);
                right1 =
                    left1 + parseInt(document.getElementById(my1).style.width);
                top1 = parseInt(document.getElementById(my1).style.top);
                bottom1 =
                    top1 + parseInt(document.getElementById(my1).style.height);
                left2 = parseInt(document.getElementById(my2).style.left);
                right2 =
                    left2 + parseInt(document.getElementById(my2).style.width);
                top2 = parseInt(document.getElementById(my2).style.top);
                bottom2 =
                    top2 + parseInt(document.getElementById(my2).style.height);
                if (
                    right1 >= left2 &&
                    bottom1 >= top2 &&
                    left1 <= right2 &&
                    top1 <= bottom2
                ) {
                    return true;
                }
            }

            function myCheckHit() {
                if (myHitOther("myImg01", "myImg02")) {
                    alert("you lose");
                    document.getElementById("myImg01").style.left = "20px";
                    // location = "t2a13-keydown.html"; // at this point this is ridiculous, file's not real
                }

                // more if statements here like the above
            } // end of myCheckHit()
        </script>
    </head>

    <body id="myBody">
        <main>
            <h1>t2a18 - game template</h1>
            <hr />

            <!-- PUT. THIS ALL. IN A CONTAINER, FOR THE LOVE OF GOD.-->

            <!-- placeholder images: swap myImage01.jpg / myImage02.jpg for real sprites. -->
            <img
                id="myImg01"
                style="
                    position: absolute;
                    width: 100px;
                    height: 80px;
                    top: 20px;
                    left: 50px;
                "
                src="myImage01.jpg"
            />
            <img
                id="myImg02"
                style="
                    position: absolute;
                    width: 100px;
                    height: 80px;
                    top: 20px;
                    left: 250px;
                "
                src="myImage02.jpg"
            />

            <br /><br /><br />
            <p>
                Use the buttons below to scroll the background or move the first
                image right. When the two images collide, you lose!
            </p>
            <hr />

            <input
                type="button"
                value="Auto Background Left"
                onclick="
                    // overwrites the background, completely destroying the black gradient.
                    {
                        clearInterval(myClock);
                        let myTemp = '100px 0px';
                        myClock = setInterval(function () {
                            myGlobalX -= 5;
                            myTemp = myGlobalX + 'px 0px';
                            document.getElementById(
                                'myBody',
                            ).style.backgroundPosition = myTemp;
                        }, 100);
                    }
                "
            />

            <input
                type="button"
                value="Image Right Fast Button"
                ontouchstart="{this.click(); event.preventDefault();}"
                onclick="
                    {
                        document.getElementById('myImg01').style.left =
                            parseInt(
                                document.getElementById('myImg01').style.left,
                            ) +
                            10 +
                            'px';
                        myCheckHit(); // checks for all collisions
                    }
                "
            /><br /><br />

            <hr />
            <p class="center">Last updated: <span id="lastModified"></span></p>
        </main>
        <script>
            // Display the document last modified date.
            document.getElementById("lastModified").textContent =
                document.lastModified;
        </script>
    </body>
</html>
