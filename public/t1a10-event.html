<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>t1a10 - events</title>
        <link rel="stylesheet" href="../baseline.css" />
    </head>
    <body>
        <main>
            <h1>t1a10 - events</h1>

            <p>Demonstrates responding to user events such as clicks and input changes.</p>

            <input id="eventInput" type="text" placeholder="Type something..." /><br /><br />

            <input type="button" value="Click me" id="btnClick" /><br /><br />

            <div id="eventOutput">...</div>
        </main>

        <p>Last updated: <span id="lastModified"></span></p>
        <script>
            document.getElementById("btnClick").addEventListener("click", function () {
                let value = document.getElementById("eventInput").value;
                if (value == "") {
                    document.getElementById("eventOutput").innerHTML =
                        "Please input something, anything";

                    // todo: add counter to track how many times btnClick has experienced something
                    //       like having it's button (singular) pushed one too many times, and slowly
                    //       responding with snarkier and snarkier statements that I'm too unimaginative
                    //       to create.
                } else {
                    document.getElementById("eventOutput").innerHTML =
                        "Button clicked with value: " + value;
                }
            });
        </script>
        <script src="../theme.js" defer></script>
        <script>
            // Display the document last modified date.
            document.getElementById("lastModified").textContent = document.lastModified;
        </script>
    </body>
</html>
