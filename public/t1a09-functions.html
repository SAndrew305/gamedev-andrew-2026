<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>t1a09 - functions</title>
        <link rel="stylesheet" href="../baseline.css" />
        <script>
            /**
             * Returns a string showing the input number added to itself.
             */

            function obtainValues() {
                const userValue0 = document.getElementById("text1").value;
                const userValue1 = parseInt(userValue0, 10);
                return userValue1;
            }

            function exampleFunction() {
                const input = obtainValues();

                if (isNaN(input)) {
                    return "Please enter a valid number.";
                }

                const sumAdd = input + input;
                const sumHalf = input / 2;
                const sumSq = input * input;
                return input + " + " + input + " = " + sumAdd + "<br>" + input + " / " + "2 " + " = " + sumHalf + "<br />"+ input + " squared " + " = " + sumSq;
            }

            function userRandInt() {
                const input = obtainValues();

                if (isNaN(input)) {
                    return "Please enter a valid number.";
                }

                const randInt = Math.floor(Math.random() * input) + 1;
                return "Random integer between 1 and " + input + ": " + randInt;
            }
        </script>
    </head>
    <body>
        <main>
            <h1>t1a09 - functions</h1>

            <p>
                <a href="https://www.w3schools.com/programming/prog_functions.php"
                    >General reference: functions</a
                >
            </p>

            <p>
                Functions group code so it can be reused. Values can be passed in and results
                returned.
            </p>

            <h3>Working example</h3>
            <input type="text" id="text1" placeholder="Insert number here" /><br /><br />

            <input type="button" value="Function example" id="btnFunc0" />

            <div id="division1">...</div><br />

            <h3>
                Example of function generating randInt between 1 + userValue:
            </h3>

            <input type="button" value="Function example" id="btnFunc1" />
            <div id="division2">...</div>
        </main>

        <p>Last updated: <span id="lastModified"></span></p>
        <script>
            document.getElementById("btnFunc0").addEventListener("click", function () {
                document.getElementById("division1").innerHTML = exampleFunction();
            });
            document.getElementById("btnFunc1").addEventListener("click", function () {
                document.getElementById("division2").innerHTML = userRandInt();
            });
        </script>
        <script src="../theme.js" defer></script>
        <script>
            // Display the document last modified date.
            document.getElementById("lastModified").textContent = document.lastModified;
        </script>
    </body>
</html>
