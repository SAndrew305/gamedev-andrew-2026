<script>

function exampleFunction() {
    let input1 = parseInt(document.getElementById('text1').value);

    let reply = input1 + ' + ' + input1 + ' = ' + sum1;
    return reply
}

    // information can also be passed onto functions (more on that later) <br>

    <h4>example of the functioning code</h4>
    ----------<br>
    <input type="text" id="text1" value="8"><br>
    
    <input type="button" value="function example" onClick="{
        document.getElementById('division1').innerHTML = exampleFunction()
