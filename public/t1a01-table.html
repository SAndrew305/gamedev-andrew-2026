<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t1a01 - tables</title>
    <link rel="stylesheet" href="../baseline.css">
</head>
<body>
    <main>
        <h1>t1a01 - tables</h1>
        <p>A simple reminder of how HTML tables work.</p>

        <table border="1">
            <caption>Example table: numbers in the first row, letters in the second row</caption>
            <thead>
                <tr>
                    <th scope="col">Column 1</th>
                    <th scope="col">Column 2</th>
                    <th scope="col">Column 3</th>
                    <th scope="col">Column 4</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                </tr>
                <tr>
                    <td>A</td>
                    <td>B</td>
                    <td>C</td>
                    <td>D</td>
                </tr>
            </tbody>
        </table>
    </main>

    <p>Last commit: <span id="lastModified"></span></p>
    <script>
        // Display the document last modified date.
        document.getElementById('lastModified').textContent = document.lastModified;
    </script>
</body>
</html>
