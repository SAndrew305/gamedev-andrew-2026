    <body>
        <h1>t1a11 - arrays</h1>

        <a href="https://www.w3schools.com/programming/prog_arrays.php">arrays refrence.</a><br />

        <h4>example functioning array code</h4>

        Max Array Entry:
        <input type="number" id="myText1" value="3" /><br />

        <input
            type="button"
            value="example onClick"
            onClick="{
    let myTemp = document.getElementById('myText1').value
    let mySum = ''
    document.getElementById('myDiv1').innerHTML = ' '

    myArray = new Array()
    myArray[0] = 'Fred'
    myArray[1] = 'Mary'
    myArray[2] = 'Liz'

    for (let myLoop=0; myLoop<myTemp; myLoop++){
        mySum += 'Loop #: ' + myLoop + ' array entry: ' + myArray[myLoop] + '<br>'
    }
    document.getElementById('myDiv1').innerHTML = mySum
}"
        />

        <div id="myDiv1">...</div>

        <br />
        <!-- you do arrays that do different things, hopefully some with integers instead of strings.-->
    </body>
</html>
