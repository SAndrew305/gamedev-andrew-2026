<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>t1a06 - proper + variables</title>
        <link rel="stylesheet" href="../baseline.css" />
        <script src="../theme.js" defer></script>
    </head>
    <body>
        <main>
            <h1>t1a06 - variables</h1>
            <p>
                Variables store values so they can be reused. This example declares a number, some
                text, a decimal, and a boolean, then combines them into one string. It also shows
                the difference between declaring variables properly and reusing them.
            </p>
            <p><strong>Bold text</strong></p>

            <!-- todo: add fields for user interactivity with this static page -->

            <button type="button" id="helloBtn">Click this</button>
            <div id="variableOutput">...</div>
        </main>

        <p>Last updated: <span id="lastModified"></span></p>
        <script>

            // todo: change `var` to `let` and add in constants, because big E didn't include
            //       constants or any of the important stuff we as young developers should know.            

            function speakHello() {
                var number = 3;
                var text = " Hello ";
                var decimal = 17.5;
                var isReady = true;
                var output = document.getElementById("variableOutput");

                output.innerHTML = number + text + decimal + ", " + isReady;
                if (isReady) {
                    output.innerHTML += ", HOW";
                }
            }

            document.getElementById("helloBtn").addEventListener("click", speakHello);
        </script>
        <script>
            // Display the document last modified date.
            document.getElementById("lastModified").textContent = document.lastModified;
        </script>
    </body>
</html>
