<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t1a06 - proper + variables</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;

            color: #000000;
            transition: color 2s ease-in-out;
        }

        /* Dark-mode overlay */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(to bottom right, #37383a, #1e1f20, #5b636b);
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        body.dark {
            color: #ffffff;
        }

        body.dark::after {
            opacity: 1;
        }
    </style>

    <script>
        function speakHello() {
            const number = 3;
            const text = ' Hello ';
            const decimal = 17.5;
            const isReady = true;
            const output = document.getElementById('variableOutput');

            output.innerHTML = number + text + decimal + ', ' + isReady;
            if (isReady) {
                output.innerHTML += ', HOW';
            }
        }

        function shiftBackground() {
            document.body.classList.add('dark');
        }
    </script>
</head>
<body>
    <main>
        <h1>t1a06 - variables</h1>
        <p><strong>Bold text</strong></p>

        <button onclick="speakHello()">Click this</button>
        <div id="variableOutput">...</div>

        <button onclick="shiftBackground()" id="pressMe">Dark mode</button>
    </main>

    <p>Last commit: <span id="lastModified"></span></p>
    <script>
        // Display the document last modified date.
        document.getElementById('lastModified').textContent = document.lastModified;
    </script>
</body>
</html>
